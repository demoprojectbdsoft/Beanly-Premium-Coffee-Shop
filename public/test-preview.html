<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sparq Brand Assets Test</title>
  <style>
    body {
      background: #0b1220;
      color: white;
      font-family: 'Poppins', system-ui, sans-serif;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 30px;
      align-items: center;
    }
    .grid {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .card-dark {
      background: #0b1220;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 24px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .card-light {
      background: #ffffff;
      color: #0b1220;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      padding: 24px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .logo-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .wordmark {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    .wordmark-light {
      color: #0b1220;
    }
    .wordmark-dark {
      color: #ffffff;
    }
    .q-wrap {
      position: relative;
      display: inline-block;
    }
    .q-accent {
      position: absolute;
      bottom: 2px;
      right: -2px;
      width: 7px;
      height: 9px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      transform: skewX(-12deg);
      border-radius: 1px;
    }
    .slogan {
      font-size: 13px;
      color: #94a3b8;
      margin: 0;
    }
  </style>
</head>
<body>
  <h1>Sparq Brand Mockup Verification</h1>

  <div class="grid">
    <!-- Dark Mode Logo -->
    <div class="card-dark">
      <h3>Dark Background</h3>
      <div class="logo-row">
        <img src="/sparq-icon.png" width="48" height="42" alt="Sparq" />
        <span class="wordmark wordmark-dark">par<span class="q-wrap">q<span class="q-accent"></span></span></span>
      </div>
      <p class="slogan">Better products. A brighter you.</p>
    </div>

    <!-- Light Mode Logo -->
    <div class="card-light">
      <h3 style="color: #64748b;">Light Background</h3>
      <div class="logo-row">
        <img src="/sparq-icon.png" width="48" height="42" alt="Sparq" />
        <span class="wordmark wordmark-light">par<span class="q-wrap">q<span class="q-accent"></span></span></span>
      </div>
      <p class="slogan" style="color: #64748b;">Better products. A brighter you.</p>
    </div>

    <!-- PWA App Icon -->
    <div class="card-dark">
      <h3>App Icon (PWA 512x512)</h3>
      <img src="/icon-512.png" width="96" height="96" style="border-radius: 24px;" alt="PWA Icon" />
    </div>
  </div>
</body>
</html>
